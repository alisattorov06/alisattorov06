<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ali Sattorov - Particle Avatar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a1a;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    canvas {
      display: block;
    }
    .info {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.4);
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      pointer-events: none;
      text-shadow: 0 0 20px rgba(106,90,205,0.3);
    }
    @media (max-width: 600px) {
      .info { font-size: 10px; bottom: 20px; }
    }
  </style>
</head>
<body>
  <div class="info">Ali Sattorov &mdash; Software Engineer</div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.src = './avatar-original.jpg';

    img.onload = () => {
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0a1a);

      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 4.5;

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setClearColor(0x0a0a1a, 1);
      document.body.prepend(renderer.domElement);

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const size = 200;
      canvas.width = size;
      canvas.height = size;
      ctx.drawImage(img, 0, 0, size, size);
      const data = ctx.getImageData(0, 0, size, size).data;

      const positions = [];
      const colors = [];
      const sizes = [];

      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const i = (y * size + x) * 4;
          const r = data[i] / 255;
          const g = data[i + 1] / 255;
          const b = data[i + 2] / 255;
          const a = data[i + 3] / 255;
          const brightness = (r + g + b) / 3;

          if (a > 0.5 && brightness > 0.1) {
            const px = (x / size - 0.5) * 3.6;
            const py = (0.5 - y / size) * 3.6;
            positions.push(px, py, 0);
            colors.push(r, g, b);
            sizes.push(0.02 + brightness * 0.04 + Math.random() * 0.015);
          }
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geo.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));

      const particleCount = positions.length / 3;
      const spread = 0.6;
      const offsets = new Float32Array(particleCount * 3);
      const speeds = new Float32Array(particleCount);
      for (let i = 0; i < particleCount; i++) {
        offsets[i * 3] = (Math.random() - 0.5) * spread;
        offsets[i * 3 + 1] = (Math.random() - 0.5) * spread;
        offsets[i * 3 + 2] = (Math.random() - 0.5) * spread;
        speeds[i] = 0.2 + Math.random() * 0.5;
      }
      geo.setAttribute('offset', new THREE.Float32BufferAttribute(offsets, 3));
      geo.setAttribute('speed', new THREE.Float32BufferAttribute(speeds, 1));

      const material = new THREE.PointsMaterial({
        size: 0.035,
        vertexColors: true,
        transparent: true,
        opacity: 0.95,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        sizeAttenuation: true,
      });

      const particles = new THREE.Points(geo, material);
      scene.add(particles);

      const glowGeo = new THREE.BufferGeometry();
      const glowPositions = [];
      for (let i = 0; i < Math.min(particleCount, 3000); i++) {
        const idx = i * 3;
        glowPositions.push(
          positions[idx] + (Math.random() - 0.5) * 0.4,
          positions[idx + 1] + (Math.random() - 0.5) * 0.4,
          positions[idx + 2] + (Math.random() - 0.5) * 0.4
        );
      }
      glowGeo.setAttribute('position', new THREE.Float32BufferAttribute(glowPositions, 3));

      const glowMat = new THREE.PointsMaterial({
        size: 0.12,
        color: 0x6A5ACD,
        transparent: true,
        opacity: 0.15,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        sizeAttenuation: true,
      });
      const glowParticles = new THREE.Points(glowGeo, glowMat);
      scene.add(glowParticles);

      const mouse = { x: 0, y: 0 };
      document.addEventListener('mousemove', (e) => {
        mouse.x = (e.clientX / window.innerWidth - 0.5) * 2;
        mouse.y = -(e.clientY / window.innerHeight - 0.5) * 2;
      });
      document.addEventListener('touchmove', (e) => {
        const t = e.touches[0];
        mouse.x = (t.clientX / window.innerWidth - 0.5) * 2;
        mouse.y = -(t.clientY / window.innerHeight - 0.5) * 2;
      }, { passive: true });

      let time = 0;
      function animate() {
        requestAnimationFrame(animate);
        time += 0.008;

        const pos = particles.geometry.attributes.position.array;
        const off = particles.geometry.attributes.offset.array;
        const spd = particles.geometry.attributes.speed.array;

        for (let i = 0; i < particleCount; i++) {
          const i3 = i * 3;
          const waveX = Math.sin(time * spd[i] + i * 0.01) * 0.015;
          const waveY = Math.cos(time * spd[i] * 0.7 + i * 0.015) * 0.015;
          const waveZ = Math.sin(time * spd[i] * 0.5 + i * 0.02) * 0.008;

          pos[i3] = positions[i3] + off[i3] + waveX;
          pos[i3 + 1] = positions[i3 + 1] + off[i3 + 1] + waveY;
          pos[i3 + 2] = positions[i3 + 2] + off[i3 + 2] + waveZ;
        }
        particles.geometry.attributes.position.needsUpdate = true;

        const targetRotY = mouse.x * 0.3;
        const targetRotX = mouse.y * 0.15;
        particles.rotation.y += (targetRotY - particles.rotation.y) * 0.03;
        particles.rotation.x += (targetRotX - particles.rotation.x) * 0.03;
        glowParticles.rotation.y = particles.rotation.y;
        glowParticles.rotation.x = particles.rotation.x;

        particles.rotation.z += 0.0003;

        renderer.render(scene, camera);
      }

      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    };

    img.onerror = () => {
      document.body.innerHTML = `
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;color:rgba(255,255,255,0.7);font-family:sans-serif;">
          <div style="font-size:48px;margin-bottom:16px;">⚡</div>
          <div>Ali Sattorov</div>
          <div style="font-size:14px;opacity:0.5;margin-top:8px;">Software Engineer & AI Developer</div>
        </div>
      `;
    };
  </script>
</body>
</html>
