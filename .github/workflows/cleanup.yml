name: Monthly Cleanup

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove old workflow runs
        uses: MattKunze/delete-old-workflow-runs@main
        with:
          repository: alisattorov06/alisattorov06
          older-than-seconds: 2592000
          keep-minimum-runs: 5

      - name: Optimize assets
        run: |
          echo "Cleanup completed at $(date -u)"
